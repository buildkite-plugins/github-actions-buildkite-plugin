name: Plugin smoke

on:
  push:
  pull_request:

jobs:
  verify:
    name: Verify plugin runtime
    runs-on: ubuntu-latest
    steps:
      - name: Verify runtime context
        shell: bash
        run: |
          test "${GITHUB_ACTIONS:-}" = true
          test "${RUNNER_OS:-}" = Linux
          test -n "${GITHUB_SHA:-}"
          test -n "${GITHUB_REPOSITORY:-}"
