name: Plugin smoke

on:
  push:
  pull_request:

jobs:
  verify:
    name: Verify released plugin defaults
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Verify candidate source
        run: |
          grep -F 'default: "0.2.2"' plugin.yml
          grep -F '0.2.2}}' hooks/command
