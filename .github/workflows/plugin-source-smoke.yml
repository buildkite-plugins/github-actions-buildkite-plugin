name: Plugin source smoke

on:
  push:
  pull_request:

jobs:
  source-smoke:
    name: Verify source runtime
    runs-on: ubuntu-latest
    steps:
      - name: Verify runtime context
        shell: bash
        run: |
          test "${GITHUB_ACTIONS:-}" = true
          test "${RUNNER_OS:-}" = Linux
          if [[ -n "${BUILDKITE:-}" ]]; then
            test "$(id -un)" = runner
            test "${HOME:-}" = /home/runner
            test "${TMPDIR:-}" = /tmp/buildkite-gha-runner
          fi
          test -n "${GITHUB_SHA:-}"
          test -n "${GITHUB_REPOSITORY:-}"
