steps:
  - label: ":sparkles: Tests"
    key: "plugin-tests"
    command: |
      docker run --rm -t \
        -v "$$PWD:/plugin" \
        buildkite/plugin-tester:v4.3.0 \
        bats tests
  - label: ":lint-roller: Plugin lint"
    key: "plugin-lint"
    plugins:
      - plugin-linter#v3.3.0:
          id: github-actions
          skip-invalid: true
  - label: ":shell: Shellcheck"
    key: "shellcheck"
    plugins:
      - shellcheck#v1.4.0:
          files:
            - hooks/*
            - lib/*
  - label: ":pipeline: Load live plugin smoke"
    key: "live-plugin-smoke-loader"
    agents:
      queue: "hosted"
    timeout_in_minutes: 15
    retry:
      automatic: false
    command: |
      set -euo pipefail
      commit="$${BUILDKITE_COMMIT:?BUILDKITE_COMMIT is required}"
      [[ "$$commit" =~ ^[0-9a-f]{40}$$ ]]
      cat <<YAML | buildkite-agent pipeline upload --no-interpolation
      steps:
        - label: ":github: Live Linux release smoke"
          key: "live-linux-release-smoke-importer"
          agents:
            queue: "hosted"
          timeout_in_minutes: 20
          retry:
            automatic: false
          env:
            BUILDKITE_PLUGINS_ALWAYS_CLONE_FRESH: "true"
          plugins:
            - github-actions#$$commit:
                workflow: .buildkite/fixtures/plugin-release-linux.yml
                version: 0.11.0
                runners:
                  - runs-on: ubuntu-latest
                    queue: hosted
                  - runs-on: ubuntu-22.04
                    queue: hosted
                    image: buildkite.namespace-images.com/agent-base@sha256:62a45683afffaae9edfd669c16d2fee23b5a571679f31715e1063dada667ea24
        - label: ":github: Live mixed release smoke"
          key: "live-mixed-release-smoke-importer"
          agents:
            queue: "hosted"
          timeout_in_minutes: 20
          retry:
            automatic: false
          env:
            BUILDKITE_PLUGINS_ALWAYS_CLONE_FRESH: "true"
          plugins:
            - github-actions#$$commit:
                workflows:
                  - .buildkite/fixtures/plugin-release-mixed.yml
                version: 0.11.0
                runners:
                  - runs-on: ubuntu-latest
                    queue: hosted
                  - runs-on: macos-14
                    queue: macos
        - label: ":github: Live macOS-only release smoke"
          key: "live-macos-release-smoke-importer"
          agents:
            queue: "hosted"
          timeout_in_minutes: 20
          retry:
            automatic: false
          env:
            BUILDKITE_PLUGINS_ALWAYS_CLONE_FRESH: "true"
          plugins:
            - github-actions#$$commit:
                workflows:
                  - .buildkite/fixtures/plugin-release-macos.yml
                version: 0.11.0
                runners:
                  - runs-on: macos-14
                    queue: macos
        - label: ":github: Live Linux source-ref smoke"
          key: "live-linux-source-ref-smoke-importer"
          agents:
            queue: "hosted"
          timeout_in_minutes: 20
          retry:
            automatic: false
          env:
            BUILDKITE_PLUGINS_ALWAYS_CLONE_FRESH: "true"
          plugins:
            - github-actions#$$commit:
                workflow: .github/workflows/plugin-source-smoke.yml
                source-ref: 24b5026bba9402a20b96004eb4f5d60a5028cc46
                runners:
                  - runs-on: ubuntu-latest
                    queue: hosted
        - label: ":github: Live mixed source-ref smoke"
          key: "live-mixed-source-ref-smoke-importer"
          agents:
            queue: "hosted"
          timeout_in_minutes: 20
          retry:
            automatic: false
          env:
            BUILDKITE_PLUGINS_ALWAYS_CLONE_FRESH: "true"
          plugins:
            - github-actions#$$commit:
                workflows:
                  - .buildkite/fixtures/plugin-source-mixed.yml
                source-ref: 24b5026bba9402a20b96004eb4f5d60a5028cc46
                runners:
                  - runs-on: ubuntu-latest
                    queue: hosted
                  - runs-on: macos-14
                    queue: macos
        - label: ":github: Live macOS-only source-ref smoke"
          key: "live-macos-source-ref-smoke-importer"
          agents:
            queue: "hosted"
          timeout_in_minutes: 20
          retry:
            automatic: false
          env:
            BUILDKITE_PLUGINS_ALWAYS_CLONE_FRESH: "true"
          plugins:
            - github-actions#$$commit:
                workflows:
                  - .buildkite/fixtures/plugin-source-macos.yml
                source-ref: 24b5026bba9402a20b96004eb4f5d60a5028cc46
                runners:
                  - runs-on: macos-14
                    queue: macos
      YAML
