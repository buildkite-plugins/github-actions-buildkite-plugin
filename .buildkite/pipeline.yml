steps:
  - label: ":sparkles: Tests"
    plugins:
      - plugin-tester#v1.3.0: ~
  - label: ":lint-roller: Plugin lint"
    plugins:
      - plugin-linter#v3.3.0:
          id: github-actions
  - label: ":shell: Shellcheck"
    plugins:
      - shellcheck#v1.4.0:
          files:
            - hooks/*
            - lib/*
  - label: ":pipeline: Load live plugin smoke"
    key: "live-plugin-smoke-loader"
    agents:
      queue: "hosted"
    timeout_in_minutes: 15
    retry:
      automatic: false
    command: |
      set -euo pipefail
      commit="$${BUILDKITE_COMMIT:?BUILDKITE_COMMIT is required}"
      source_ref="$${GITHUB_ACTIONS_SOURCE_REF:-}"
      [[ "$$commit" =~ ^[0-9a-f]{40}$$ ]]
      plugin_config=(
        "      - github-actions#$$commit:"
        "          workflow: .github/workflows/plugin-smoke.yml"
      )
      if [[ -n "$$source_ref" ]]; then
        [[ "$$source_ref" == latest || "$$source_ref" =~ ^[0-9a-f]{40}$$ ]]
        plugin_config=(
          '      - mise#a5845c5082d3a4fe36dd77ae74973dfc86fc91a2:'
          '          version: "2026.5.12"'
          "$${plugin_config[@]}"
          "          buildkite-gha-source-ref: \"$$source_ref\""
        )
      fi
      {
        cat <<YAML
      steps:
        - label: ":github: Live plugin smoke"
          key: "live-plugin-smoke-importer"
          agents:
            queue: "hosted"
          timeout_in_minutes: 20
          retry:
            automatic: false
          env:
            BUILDKITE_PLUGINS_ALWAYS_CLONE_FRESH: "true"
          plugins:
      YAML
        printf '%s\n' "$${plugin_config[@]}"
      } | buildkite-agent pipeline upload
