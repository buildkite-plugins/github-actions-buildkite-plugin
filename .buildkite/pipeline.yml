steps:
  - label: ":sparkles: Tests"
    key: "plugin-tests"
    command: |
      docker run --rm -t \
        -v "$$PWD:/plugin" \
        buildkite/plugin-tester:v4.3.0 \
        bash -c 'apk add --no-cache jq perl-utils && bats tests'
  - label: ":lint-roller: Plugin lint"
    key: "plugin-lint"
    plugins:
      - plugin-linter#v4.1.0:
          id: github-actions
          image-version: latest
          skip-invalid: true
  - label: ":shell: Shellcheck"
    key: "shellcheck"
    plugins:
      - shellcheck#v1.4.0:
          files:
            - hooks/*
  - label: ":pipeline: Load live plugin smoke"
    key: "live-plugin-smoke-loader"
    agents:
      queue: "hosted"
    timeout_in_minutes: 15
    retry:
      automatic: false
    command: |
      set -euo pipefail
      commit="$${BUILDKITE_COMMIT:?BUILDKITE_COMMIT is required}"
      [[ "$$commit" =~ ^[0-9a-f]{40}$$ ]]
      plugin_ref="$${PLUGIN_SMOKE_REF:-$$commit}"
      version="$${PLUGIN_SMOKE_VERSION:-0.107.1}"
      [[ "$$plugin_ref" =~ ^([0-9a-f]{40}|v[0-9]+\.[0-9]+\.[0-9]+)$$ ]]
      [[ "$$version" =~ ^(latest|v?[0-9]+\.[0-9]+\.[0-9]+)$$ ]]
      echo "Testing plugin $$plugin_ref with CLI $$version"
      cat <<YAML | buildkite-agent pipeline upload --no-interpolation
      steps:
        - label: ":github: Live Linux release smoke"
          key: "live-linux-release-smoke-importer"
          agents:
            queue: "hosted"
          timeout_in_minutes: 20
          retry:
            automatic: false
          env:
            BUILDKITE_PLUGINS_ALWAYS_CLONE_FRESH: "true"
          plugins:
            - github-actions#$$plugin_ref:
                workflow: .buildkite/fixtures/plugin-release-linux.yml
                version: "$$version"
                experimental-runner-user: true
                runners:
                  - runs-on: ubuntu-latest
                    queue: hosted
                  - runs-on: ubuntu-22.04
                    queue: hosted
                    image: buildkite.namespace-images.com/agent-base@sha256:62a45683afffaae9edfd669c16d2fee23b5a571679f31715e1063dada667ea24
        - label: ":github: Live mixed release smoke"
          key: "live-mixed-release-smoke-importer"
          agents:
            queue: "hosted"
          timeout_in_minutes: 20
          retry:
            automatic: false
          env:
            BUILDKITE_PLUGINS_ALWAYS_CLONE_FRESH: "true"
          plugins:
            - github-actions#$$plugin_ref:
                workflows:
                  - .buildkite/fixtures/plugin-release-mixed.yml
                version: "$$version"
                experimental-runner-user: false
                runners:
                  - runs-on: ubuntu-latest
                    queue: hosted
                  - runs-on: macos-14
                    queue: macos
        - label: ":github: Live macOS-only release smoke"
          key: "live-macos-release-smoke-importer"
          agents:
            queue: "hosted"
          timeout_in_minutes: 20
          retry:
            automatic: false
          env:
            BUILDKITE_PLUGINS_ALWAYS_CLONE_FRESH: "true"
          plugins:
            - github-actions#$$plugin_ref:
                workflows:
                  - .buildkite/fixtures/plugin-release-macos.yml
                version: "$$version"
                runners:
                  - runs-on: macos-14
                    queue: macos
        - label: ":github: Live native macOS importer release smoke"
          key: "live-native-macos-importer-release-smoke"
          agents:
            queue: "macos"
          timeout_in_minutes: 20
          retry:
            automatic: false
          plugins:
            - github-actions#$$plugin_ref:
                workflows:
                  # Distinct paths prevent step-key collisions with Linux importers.
                  - .buildkite/fixtures/plugin-native-importer-release-macos.yml
                version: "$$version"
                runners:
                  - runs-on: macos-14
                    queue: macos
        - label: ":github: Live native macOS mixed importer release smoke"
          key: "live-native-macos-mixed-importer-release-smoke"
          agents:
            queue: "macos"
          timeout_in_minutes: 20
          retry:
            automatic: false
          plugins:
            - github-actions#$$plugin_ref:
                workflows:
                  - .buildkite/fixtures/plugin-native-importer-release-mixed.yml
                version: "$$version"
                experimental-runner-user: false
                runners:
                  - runs-on: ubuntu-latest
                    queue: hosted
                  - runs-on: macos-14
                    queue: macos
      YAML
