steps:
  - label: ":sparkles: Tests"
    plugins:
      - plugin-tester#v1.3.0: ~
  - label: ":lint-roller: Plugin lint"
    plugins:
      - plugin-linter#v3.3.0:
          id: github-actions
  - label: ":shell: Shellcheck"
    plugins:
      - shellcheck#v1.4.0:
          files:
            - hooks/*
            - lib/*
  - label: ":pipeline: Load live plugin smoke"
    key: "live-plugin-smoke-loader"
    agents:
      queue: "hosted"
    timeout_in_minutes: 15
    retry:
      automatic: false
    command: |
      set -euo pipefail
      commit="$${BUILDKITE_COMMIT:?BUILDKITE_COMMIT is required}"
      [[ "$$commit" =~ ^[0-9a-f]{40}$$ ]]
      cat <<YAML | buildkite-agent pipeline upload
      steps:
        - label: ":github: Live plugin smoke"
          key: "live-plugin-smoke-importer"
          agents:
            queue: "hosted"
          timeout_in_minutes: 20
          retry:
            automatic: false
          env:
            BUILDKITE_PLUGINS_ALWAYS_CLONE_FRESH: "true"
            BUILDKITE_GHA_TARGET_QUEUE: "hosted"
          plugins:
            - github-actions#$$commit:
                workflow: .github/workflows/plugin-smoke.yml
        - label: ":github: Live Linux source-ref smoke"
          key: "live-linux-source-ref-smoke-importer"
          agents:
            queue: "hosted"
          timeout_in_minutes: 20
          retry:
            automatic: false
          env:
            BUILDKITE_PLUGINS_ALWAYS_CLONE_FRESH: "true"
          plugins:
            - github-actions#$$commit:
                workflow: .github/workflows/plugin-source-smoke.yml
                source-ref: 782270db1b6d400f38b434aeee6d2e93f3634b45
                runners:
                  - runs-on: ubuntu-latest
                    queue: hosted
        - label: ":github: Live mixed source-ref smoke"
          key: "live-mixed-source-ref-smoke-importer"
          agents:
            queue: "hosted"
          timeout_in_minutes: 20
          retry:
            automatic: false
          env:
            BUILDKITE_PLUGINS_ALWAYS_CLONE_FRESH: "true"
          plugins:
            - github-actions#$$commit:
                workflow: .buildkite/fixtures/plugin-source-mixed.yml
                source-ref: 782270db1b6d400f38b434aeee6d2e93f3634b45
                runners:
                  - runs-on: ubuntu-latest
                    queue: hosted
                  - runs-on: macos-14
                    queue: macos
        - label: ":github: Live macOS-only source-ref smoke"
          key: "live-macos-source-ref-smoke-importer"
          agents:
            queue: "hosted"
          timeout_in_minutes: 20
          retry:
            automatic: false
          env:
            BUILDKITE_PLUGINS_ALWAYS_CLONE_FRESH: "true"
          plugins:
            - github-actions#$$commit:
                workflow: .buildkite/fixtures/plugin-source-macos.yml
                source-ref: 782270db1b6d400f38b434aeee6d2e93f3634b45
                runners:
                  - runs-on: macos-14
                    queue: macos
      YAML
