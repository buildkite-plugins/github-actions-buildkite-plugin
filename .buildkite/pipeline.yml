steps:
  - label: ":sparkles: Tests"
    key: "plugin-tests"
    command: |
      docker run --rm -t \
        -v "$$PWD:/plugin" \
        buildkite/plugin-tester:v4.3.0 \
        sh -c 'apk add --no-cache git >/dev/null && bats tests'
  - label: ":lint-roller: Plugin lint"
    key: "plugin-lint"
    plugins:
      - plugin-linter#v3.3.0:
          id: github-actions
  - label: ":shell: Shellcheck"
    key: "shellcheck"
    plugins:
      - shellcheck#v1.4.0:
          files:
            - .buildkite/scripts/*
            - hooks/*
            - lib/*
  - label: ":pipeline: Load live plugin smoke"
    key: "live-plugin-smoke-loader"
    agents:
      queue: "hosted"
    timeout_in_minutes: 15
    retry:
      automatic: false
    command: |
      set -euo pipefail
      commit="$${BUILDKITE_COMMIT:?BUILDKITE_COMMIT is required}"
      [[ "$$commit" =~ ^[0-9a-f]{40}$$ ]]
      cat <<YAML | buildkite-agent pipeline upload --no-interpolation
      steps:
        - label: ":github: Live plugin smoke"
          key: "live-plugin-smoke-importer"
          agents:
            queue: "hosted"
          timeout_in_minutes: 20
          retry:
            automatic: false
          env:
            BUILDKITE_PLUGINS_ALWAYS_CLONE_FRESH: "true"
            BUILDKITE_GHA_TARGET_QUEUE: "hosted"
          plugins:
            - github-actions#$$commit:
                workflow: .github/workflows/plugin-smoke.yml
        - label: ":github: Live source-ref smoke"
          key: "live-source-ref-smoke-importer"
          agents:
            queue: "hosted"
          timeout_in_minutes: 20
          retry:
            automatic: false
          env:
            BUILDKITE_PLUGINS_ALWAYS_CLONE_FRESH: "true"
            BUILDKITE_GHA_TARGET_QUEUE: "hosted"
          plugins:
            - github-actions#$$commit:
                workflow: .github/workflows/plugin-source-smoke.yml
                source-ref: a0e5416751456411fa09f5cf62421622e6cb57f7
        - label: ":github: Update latest plugin tag"
          key: "update-latest-plugin-tag"
          if: 'build.tag != null && build.tag =~ /^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$$/'
          depends_on:
            - "plugin-tests"
            - "plugin-lint"
            - "shellcheck"
            - "live-plugin-smoke-importer"
            - "live-source-ref-smoke-importer"
          agents:
            queue: "hosted"
          timeout_in_minutes: 10
          retry:
            automatic: false
          command: .buildkite/scripts/update-latest-tag
      YAML
