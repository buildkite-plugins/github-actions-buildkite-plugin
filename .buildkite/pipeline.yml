steps:
  - label: ":sparkles: Tests"
    plugins:
      - plugin-tester#v1.3.0: ~
  - label: ":lint-roller: Plugin lint"
    plugins:
      - plugin-linter#v3.3.0:
          id: github-actions
  - label: ":shell: Shellcheck"
    plugins:
      - shellcheck#v1.4.0:
          files:
            - hooks/*
            - lib/*
  - label: ":pipeline: Load live released plugin smoke"
    key: "live-plugin-smoke-loader"
    agents:
      queue: "hosted"
    timeout_in_minutes: 15
    retry:
      automatic: false
    command: |
      set -euo pipefail
      commit="$${BUILDKITE_COMMIT:?BUILDKITE_COMMIT is required}"
      [[ "$$commit" =~ ^[0-9a-f]{40}$$ ]]
      cat <<YAML | buildkite-agent pipeline upload
      steps:
        - label: ":github: Live released plugin smoke"
          key: "live-plugin-smoke-importer"
          agents:
            queue: "hosted"
          timeout_in_minutes: 15
          retry:
            automatic: false
          env:
            BUILDKITE_PLUGINS_ALWAYS_CLONE_FRESH: "true"
          plugins:
            - github-actions#$$commit:
                workflow: .github/workflows/plugin-smoke.yml
      YAML

  - label: ":pipeline: Load live source plugin smoke"
    key: "live-source-plugin-smoke-loader"
    if: build.env("GITHUB_ACTIONS_SOURCE_REF") != null
    agents:
      queue: "hosted"
    timeout_in_minutes: 15
    retry:
      automatic: false
    command: |
      set -euo pipefail
      commit="$${BUILDKITE_COMMIT:?BUILDKITE_COMMIT is required}"
      source_ref="$${GITHUB_ACTIONS_SOURCE_REF:?GITHUB_ACTIONS_SOURCE_REF is required}"
      [[ "$$commit" =~ ^[0-9a-f]{40}$$ ]]
      [[ "$$source_ref" == latest || "$$source_ref" =~ ^[0-9a-f]{40}$$ ]]
      cat <<YAML | buildkite-agent pipeline upload
      steps:
        - label: ":github: Live source plugin smoke"
          key: "live-source-plugin-smoke-importer"
          agents:
            queue: "hosted"
          timeout_in_minutes: 20
          retry:
            automatic: false
          env:
            BUILDKITE_PLUGINS_ALWAYS_CLONE_FRESH: "true"
          plugins:
            - mise#a5845c5082d3a4fe36dd77ae74973dfc86fc91a2:
                version: "2026.5.12"
            - github-actions#$$commit:
                workflow: .github/workflows/plugin-smoke.yml
                buildkite-gha-source-ref: "$$source_ref"
      YAML
