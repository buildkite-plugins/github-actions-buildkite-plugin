name: Plugin mixed release smoke

on:
  push:

jobs:
  release-mixed-linux:
    name: Verify released mixed Linux job
    runs-on: ubuntu-latest
    steps:
      - name: Verify Linux runtime
        shell: bash
        run: |
          test "${GITHUB_ACTIONS:-}" = true
          test "${RUNNER_OS:-}" = Linux
          test -d /opt/hostedtoolcache

  release-mixed-macos:
    name: Verify released Linux to macOS dependency
    needs: release-mixed-linux
    runs-on: macos-14
    steps:
      - name: Verify macOS runtime
        shell: bash
        run: |
          test "${GITHUB_ACTIONS:-}" = true
          test "${RUNNER_OS:-}" = macOS
          test "$(uname -m)" = arm64
