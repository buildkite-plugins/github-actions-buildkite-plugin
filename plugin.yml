name: GitHub Actions
description: Run GitHub Actions workflows as native Buildkite steps
author: https://github.com/buildkite-plugins
requirements:
  - bash
  - curl
  - git
  - tar
  - sha256sum (Linux) or shasum (macOS)
  - mktemp
  - cp
configuration:
  oneOf:
    - required:
        - workflow
    - required:
        - workflows
  properties:
    workflow:
      type: string
      minLength: 1
      pattern: "^[^*?\\[\\]{}]+\\.ya?ml$"
      description: One explicit tracked .yml or .yaml workflow path.
    workflows:
      type: array
      minItems: 1
      items:
        type: string
        minLength: 1
        pattern: "^[^*?\\[\\]{}]+\\.ya?ml$"
      description: Explicit tracked .yml or .yaml workflow paths.
    version:
      type: string
      default: latest
      pattern: "^(latest|v?(0\\.(9|[1-9][0-9]+)|[1-9][0-9]*\\.(0|[1-9][0-9]*))\\.(0|[1-9][0-9]*))$"
      description: Latest stable or an exact stable buildkite-gha CLI release from 0.9.0 onward.
    source-ref:
      type: string
      pattern: "^[0-9a-f]{40}$"
      description: Full buildkite-gha source commit to build for development testing. Mutually exclusive with version.
    minimum-release-age:
      type: string
      minLength: 1
      default: 0s
      description: Minimum age passed to mise when selecting the latest buildkite-gha release.
    experimental-runner-user:
      type: boolean
      default: false
      description: Run generated Linux jobs as a dedicated runner user. Requires buildkite-gha 0.13.7 or newer.
  additionalProperties: true
