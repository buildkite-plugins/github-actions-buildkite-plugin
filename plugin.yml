name: GitHub Actions
description: Run a GitHub Actions workflow as native Buildkite steps
author: https://github.com/buildkite-plugins
requirements:
  - bash
  - curl
  - git
  - tar
  - sha256sum
  - awk
  - grep
  - find
  - sed
  - sort
  - mktemp
  - cp
configuration:
  properties:
    version:
      type: string
      default: latest
      pattern: "^(latest|v?(0\\.(8\\.[1-9][0-9]*|(9|[1-9][0-9]+)\\.(0|[1-9][0-9]*))|[1-9][0-9]*\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)))$"
      description: Latest stable or an exact stable buildkite-gha CLI release newer than 0.8.0.
  additionalProperties: true
