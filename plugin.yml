name: GitHub Actions
description: Run a GitHub Actions workflow as native Buildkite steps
author: https://github.com/buildkite-plugins
requirements:
  - bash
  - curl
  - tar
  - sha256sum
  - awk
  - grep
  - find
  - sed
  - sort
  - mktemp
  - cp
configuration:
  properties:
    workflow:
      type: string
      minLength: 1
      description: Path to the GitHub Actions workflow to upload.
    version:
      type: string
      default: "0.4.2"
      description: Exact pre-1.0 buildkite-gha CLI version.
    buildkite-gha-source-ref:
      type: string
      pattern: "^(latest|[0-9a-f]{40})$"
      description: Build buildkite-gha from the latest main commit or an exact full commit using config-free mise and pinned Go. Mutually exclusive with version.
    private-checkout:
      type: boolean
      default: false
      description: Opt verified checkout jobs into read-only authority for the pipeline's exact GitHub repository.
  required:
    - workflow
  additionalProperties: false
