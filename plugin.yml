name: GitHub Actions
description: Run GitHub Actions workflows as native Buildkite steps
author: https://github.com/buildkite-plugins
requirements:
  - curl
configuration:
  type: object
  oneOf:
    - not:
        required: [run]
    - required: [run]
      maxProperties: 1
  not:
    anyOf:
      - required: [version, binary]
      - required: [source-ref]
      - required: [minimum-release-age]
  properties:
    run:
      description: Execute an existing plan with pinned runtime bytes; no importer or release resolution.
      type: object
      required: [plan, runtime]
      additionalProperties: false
      properties:
        plan:
          type: object
          required: [digest]
          additionalProperties: false
          oneOf:
            - required: [path]
            - required: [producer]
            - required: [inline]
          properties:
            digest:
              type: string
              pattern: '^sha256:[0-9a-f]{64}$'
            path:
              type: string
              minLength: 1
              description: Local plan file, copied and verified before use.
            inline:
              type: string
              minLength: 1
              pattern: '^[A-Za-z0-9+/]+={0,2}$'
              description: Base64-encoded plan JSON, verified without rewriting its bytes.
            producer:
              type: string
              pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
              description: Exact Buildkite job UUID holding the content-addressed plan and event artifacts.
        event:
          type: object
          oneOf:
            - required: [inline]
            - required: [env]
          additionalProperties: false
          properties:
            env:
              enum: [BUILDKITE_GHA_EVENT_PAYLOAD]
              description: Read base64 event JSON from this environment variable, then unset it before execution.
            inline:
              type: string
              minLength: 1
              maxLength: 87384
              pattern: '^[A-Za-z0-9+/]+={0,2}$'
              description: Base64-encoded event JSON, at most 64 KiB decoded, bound to the plan and uploaded by the execution job.
        runtime:
          type: object
          required: [platform, url, sha256]
          additionalProperties: false
          properties:
            platform:
              enum: [linux/amd64, linux/arm64, darwin/arm64, windows/amd64]
            url:
              type: string
              pattern: '^https://[^/@\s?#]+([/?][^\s#]*)?$'
            sha256:
              type: string
              pattern: '^[0-9a-fA-F]{64}$'
        hosted-tool-cache:
          type: boolean
          default: false
          description: Prepare the platform's hosted tool cache and enable it in run-job.
        namespace:
          type: boolean
          default: false
          description: Preserve native Namespace image PATH, hostname and Docker build behavior on Linux and macOS.
    version:
      type: string
      default: latest
      pattern: '^(latest|v?(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*)(\.(0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*))*)?(\+[0-9a-zA-Z-]+(\.[0-9a-zA-Z-]+)*)?)$'
      description: Latest stable or an exact buildkite-gha release, including prereleases and historical archive releases.
    binary:
      description: HTTPS raw executable URL with optional SHA256 fragment, or URLs keyed by platform. Requires companion CLI support.
      oneOf:
        - type: string
          pattern: '^https://[^/@\s?#]+([/?][^\s#]*)?(#sha256=[0-9a-fA-F]{64})?$'
        - type: object
          minProperties: 1
          patternProperties:
            '^(linux/(amd64|arm64)|darwin/arm64|windows/amd64)$':
              type: string
              pattern: '^https://[^/@\s?#]+([/?][^\s#]*)?(#sha256=[0-9a-fA-F]{64})?$'
          additionalProperties: false
  additionalProperties: true
